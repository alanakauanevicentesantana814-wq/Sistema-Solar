<!DOCTYPE html>
<html lang="pt">
<head>
    <p>voce e o meu 23.5 da minha terra </p>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            overflow: hidden;
        }
                                        
        .container {
            position: relative;
            width: 40em;
            height: 40em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* O SOL */
        .sun { 
            position: absolute;
            width: 10em;
            height: 10em;
            background-color: yellow;
            border-radius: 50%;
            box-shadow: 0 0 3em white; 
            z-index: 10;
        }

        /* Órbita da Terra */
        .earth-orbit { 
            position: absolute;
            border-style: solid;
            border-color: white transparent transparent transparent;
            border-width: 0.1em 0.1em 0em 0em;
            border-radius: 50%;
            width: 30em;
            height: 30em;
            animation: orbit 12s linear infinite;
        }

        /* A Terra */
        .earth {
            position: absolute;
            top: 2.8em;
            right: 2.8em;
            width: 3em;
            height: 3em;
            background-color: aqua;
            border-radius: 50%;
        }

        /* Órbita da Lua (presa dentro da Terra) */
        .moon-orbit { 
            position: absolute;
            top: -1.5em;
            left: -1.5em;
            width: 6em;
            height: 6em;
            border-style: solid;
            border-color: white transparent transparent transparent;
            border-width: 0.1em 0.1em 0em 0em;
            border-radius: 50%;
            animation: orbit 3s linear infinite;
        }

        /* A Lua */
        .moon {      
            position: absolute;
            top: 0.3em;
            right: 0.3em;
            width: 1em;
            height: 1em; 
            background-color: silver;
            border-radius: 50%;
        }

        @keyframes orbit {
            to { 
                transform: rotate(360deg);
            }
        } 

    </style>
</head>
<body>
    <div class="container"> 
        <!-- Sol limpo (sem rosto) -->
        <div class="sun"></div>

        <!-- Terra e Lua em órbita -->
        <div class="earth-orbit">
            <div class="earth">
                <div class="moon-orbit">
                    <div class="moon"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<p>voce e o meu 23.5 da minha terra </p>
